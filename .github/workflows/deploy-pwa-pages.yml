name: Deploy Orbix PWA to GitHub Pages - Live Online at Root

# Deploys mobile PWA + web to GitHub Pages
# All data inside PWA configured permanently at root level: database/ + data/ + .env
# Live online via Supabase at root level (root_config.js hardcoded, permanent)
# No Python hosting needed - PWA uses Supabase JS directly + IndexedDB offline
# URL: https://Aizennn7.github.io/orbix/

on:
  push:
    branches: [main, arena/6260349f-orbix, arena/6260349f-orbix]
    paths:
      - "mobile/**"
      - "web/**"
      - "database/**"
      - "scripts/**"
      - ".github/workflows/deploy-pwa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-pwa
  cancel-in-progress: false

jobs:
  build-pwa-pages:
    name: Build PWA for GitHub Pages - Permanent at Root
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps at root
        run: |
          pip install -r requirements.txt
          pip install supabase
          python scripts/configure_root_apk.py --check || true
          python scripts/configure_root_apk.py --build || true
          ls -lh database/apk_config.json mobile/src/js/root_config.js || true
          cat database/apk_config.json || true

      - name: Install Node deps
        working-directory: mobile
        run: npm install

      - name: Build PWA with permanent root config for GitHub Pages
        working-directory: mobile
        run: |
          # Set base path for GitHub Pages: https://Aizennn7.github.io/orbix/
          # Vite base is set via env, but we need to handle it
          echo "Building PWA for GitHub Pages - permanent at root level"
          echo "Root config at root level: database/apk_config.json + mobile/src/js/root_config.js"
          cat ../database/apk_config.json || true
          
          # Build with base /orbix/ for Pages
          # Create vite config for Pages
          cat > vite.config.pages.js << 'EOF'
          import { defineConfig } from 'vite';
          import { resolve } from 'path';
          export default defineConfig({
            root: 'src',
            base: '/orbix/',
            publicDir: resolve(__dirname, '../public'),
            build: {
              outDir: '../dist-pages',
              emptyOutDir: true,
              rollupOptions: {
                input: {
                  main: resolve(__dirname, 'src/index.html')
                }
              }
            },
            server: {
              port: 3000,
              host: '0.0.0.0'
            }
          });
          EOF
          
          npx vite build --config vite.config.pages.js 2>&1 | tail -n 20
          ls -lh dist-pages/ || true
          ls -lh dist-pages/assets/ || true
          
          # Copy root-level permanent configs into dist-pages
          cp src/js/root_config.js dist-pages/assets/ 2>/dev/null || cp src/js/root_config.js dist-pages/ 2>/dev/null || true
          cp src/root_config.json dist-pages/ 2>/dev/null || true
          cp public/root_config.json dist-pages/ 2>/dev/null || true
          cp ../database/apk_config.json dist-pages/ 2>/dev/null || true
          cp ../database/root_manifest.json dist-pages/ 2>/dev/null || true
          cp ../data/root_config.json dist-pages/ 2>/dev/null || true
          cp ../web/icon-*.png dist-pages/ 2>/dev/null || true
          cp ../web/manifest.json dist-pages/ 2>/dev/null || true
          cp ../web/service-worker.js dist-pages/ 2>/dev/null || true
          
          # Also create a copy for root deployment (for custom domain)
          mkdir -p ../dist-pages-root
          cp -r dist-pages/* ../dist-pages-root/ 2>/dev/null || true
          ls -lh dist-pages/ | head -n 20
          echo "=== Permanent root configs in dist-pages (for Pages) ==="
          ls -lh dist-pages/*.json dist-pages/assets/root_config.js 2>/dev/null || true
          cat dist-pages/root_config.json || true

      - name: Build combined site for Pages (PWA + Web + Docs)
        run: |
          mkdir -p _site
          # Copy PWA built for Pages
          cp -r mobile/dist-pages/* _site/ 2>/dev/null || cp -r mobile/dist/* _site/ 2>/dev/null || true
          
          # Also copy web assets
          mkdir -p _site/web
          cp -r web/* _site/web/ 2>/dev/null || true
          
          # Copy docs if exists
          if [ -d "docs" ]; then
            mkdir -p _site/docs
            cp -r docs/* _site/docs/ 2>/dev/null || true
          fi
          
          # Create index.html that redirects to PWA if no docs
          if [ ! -f "_site/index.html" ]; then
            echo "No index.html, using PWA index"
            ls _site/ | head -n 20
          fi
          
          # Ensure root configs are present
          cp database/apk_config.json _site/ 2>/dev/null || true
          cp database/root_manifest.json _site/ 2>/dev/null || true
          cp data/root_config.json _site/ 2>/dev/null || true
          cp mobile/src/js/root_config.js _site/ 2>/dev/null || true
          
          # Create a landing page that explains Pages deployment
          cat > _site/README_PAGES.html << 'EOF'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>Orbix - GitHub Pages - Permanent at Root</title></head>
          <body style="background:#050505;color:white;font-family:system-ui;padding:20px;max-width:800px;margin:0 auto;">
          <h1>Orbix — Live Online via GitHub Pages</h1>
          <p>All data inside PWA configured permanently at root level: <code>database/</code> + <code>data/</code> + <code>.env</code> at root</p>
          <p><strong>PWA:</strong> <a href="./index.html" style="color:#8ab4ff;">Open Orbix PWA (Live)</a></p>
          <p><strong>Root Config:</strong> <a href="./root_config.json" style="color:#8ab4ff;">root_config.json</a> | <a href="./apk_config.json" style="color:#8ab4ff;">apk_config.json</a></p>
          <p><strong>How it works:</strong></p>
          <ul>
            <li>Database at root level: <code>database/apk_config.json</code> (permanent, committed)</li>
            <li>Mobile PWA reads from <code>root_config.js</code> hardcoded (permanent in PWA)</li>
            <li>Live online via Supabase at root level, offline fallback via IndexedDB</li>
            <li>All files in GitHub, not on device, root level permanent</li>
          </ul>
          <p><strong>Termux:</strong> Clone repo in Termux, run <code>./scripts/termux_setup.sh</code> for 24/7 live at root</p>
          <p><strong>APK:</strong> GitHub Actions builds APK with permanent root config (11.9 MB, live online)</p>
          </body>
          </html>
          EOF
          
          ls -lh _site/ | head -n 30
          echo "Site ready for GitHub Pages - permanent at root level"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Deploy to GitHub Pages - Live Online Permanent at Root
    needs: build-pwa-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
