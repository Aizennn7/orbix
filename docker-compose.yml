services:
  orbix:
    build: .
    image: orbix-signal-lab:latest
    container_name: orbix
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ORBIX_DATA_DIR: /data
    # Create the file first: cp .env.example .env, then fill in the login and
    # provider values. required:false keeps `docker compose up` working before
    # that copy exists (Compose v2.24+).
    env_file:
      - path: .env
        required: false
    volumes:
      - orbix-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  orbix-data:
