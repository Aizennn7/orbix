[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbix-signal-lab"
version = "0.3.0"
description = "Signal research and paper-testing dashboard for one-minute FX candles"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "duckdb>=1.4,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.setuptools.packages.find]
include = ["orbix*"]
